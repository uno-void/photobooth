<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyamu - Jeda Makna 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Tema Gelap (Navy) ala Pameran */
        body {
            background-color: #0b132b; 
            background-image: radial-gradient(circle, #1c2541 0%, #0b132b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 450px;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #f8f9fa;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8d99ae;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Efek Bingkai Polaroid */
        .frame-foto {
            background: #ffffff;
            padding: 10px 10px 45px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 4px;
            margin-bottom: 40px;
            transform: rotate(-2deg);
            transition: transform 0.4s ease;
            width: 90%;
            position: relative;
        }

        .frame-foto:hover {
            transform: rotate(0deg) scale(1.02);
        }

        img#fotoHasil {
            width: 100%;
            border-radius: 2px;
            display: block;
            background: #e0e0e0;
            min-height: 250px;
            object-fit: cover;
        }

        .pesan-polaroid {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            color: #1a1a1a;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }

        /* Tombol Estetik */
        .btn-unduh {
            background-color: #3a506b;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s;
            border: 1px solid #5bc0be;
            cursor: pointer;
            margin-bottom: 15px;
            width: 80%;
            max-width: 300px;
        }

        .btn-unduh:active {
            transform: scale(0.95);
        }

        .note {
            font-size: 0.8rem;
            color: #8d99ae;
        }

        footer {
            padding: 20px;
            font-size: 0.75rem;
            color: #5c6b73;
            width: 100%;
            background: rgba(0,0,0,0.3);
            margin-top: auto;
            letter-spacing: 1px;
        }

        /* Loading Spinner */
        #loadingText {
            margin-top: 50px;
            font-size: 1rem;
            color: #8d99ae;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jeda Makna</h1>
        <p class="subtitle">Setiap bayangan menceritakan cahaya yang berbeda.</p>

        <p id="loadingText">Menyiapkan makna...</p>

        <div class="frame-foto" id="areaFoto" style="display: none;">
            <img id="fotoHasil" src="" alt="Hasil Foto Pameran">
            <p class="pesan-polaroid">Terima Kasih</p>
        </div>

        <a id="btnUnduh" href="#" class="btn-unduh" style="display: none;">📥 SIMPAN KARYA</a>
        <p class="note" id="noteTeks" style="display: none;">Jangan lupa post di IG Story!</p>
    </div>

    <footer>
        &copy; 2026 Pameran Fotografi Jeda Makna
    </footer>

    <script>
        // 1. Ambil URL foto dari parameter yang dikirim oleh QR Code
        const urlParams = new URLSearchParams(window.location.search);
        const linkFoto = urlParams.get('foto');

        const imgElemen = document.getElementById('fotoHasil');
        const areaFoto = document.getElementById('areaFoto');
        const btnUnduh = document.getElementById('btnUnduh');
        const noteTeks = document.getElementById('noteTeks');
        const loadingText = document.getElementById('loadingText');

        if(linkFoto) {
            // Tampilkan gambar ke layar
            imgElemen.src = linkFoto;
            
            imgElemen.onload = function() {
                loadingText.style.display = 'none';
                areaFoto.style.display = 'block';
                btnUnduh.style.display = 'inline-block';
                noteTeks.style.display = 'block';
            };

            // 2. Skrip Canggih: Tarik gambar jadi Blob agar langsung masuk ke galeri HP
            fetch(linkFoto)
                .then(response => response.blob())
                .then(blob => {
                    const objectUrl = window.URL.createObjectURL(blob);
                    btnUnduh.href = objectUrl;
                    btnUnduh.download = `JedaMakna_${new Date().getTime()}.jpg`;
                })
                .catch(err => {
                    // Kalau gagal fetch (misal koneksi lambat), jadikan tombol fallback biasa
                    btnUnduh.href = linkFoto;
                    btnUnduh.target = "_blank";
                });
        } else {
            loadingText.innerText = "Maaf, foto tidak ditemukan atau link tidak valid.";
        }
    </script>
</body>
</html>
